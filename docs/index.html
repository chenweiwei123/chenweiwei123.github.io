<script>
    // 全局变量
    let fundData = [];
    let filteredData = [];
    let currentPageData = [];
    let currentPage = 1;
    let rowsPerPage = 10;
    let sortColumn = null;
    let sortDirection = 'asc';
    let typeChart = null;
    let isLoading = false;

    // 基金类型映射
    const fundTypeMap = {
        'ETF': 'ETF',
        '联接': '指数型',
        '股票': '股票型',
        '债券': '债券型',
        '混合': '混合型',
        '指数': '指数型',
        'QDII': 'QDII',
        '货币': '货币型',
        '理财': '理财型'
    };

    // 默认基金ID列表
    const defaultFundIds = ['022364', '011369', '161725', '004253'];

    // 初始化页面
    document.addEventListener('DOMContentLoaded', function() {
        // 生成默认基金数据
        generateDefaultFunds();

        // 设置事件监听器
        setupEventListeners();

        // 启动模拟实时数据更新
        startRealTimeUpdates();
    });

    // 从API获取基金数据
    function fetchFundData(fundId) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            const url = `http://fundgz.1234567.com.cn/js/${fundId}.js?rt=${Date.now()}`;

            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            // 使用正则表达式提取JSON数据
                            const responseText = xhr.responseText;
                            const jsonMatch = responseText.match(/jsonpgz<inline_LaTeX_Formula>(.*?)<\inline_LaTeX_Formula>;/);

                            if (jsonMatch && jsonMatch[1]) {
                                const jsonData = JSON.parse(jsonMatch[1]);
                                resolve(jsonData);
                            } else {
                                throw new Error('无法解析返回数据');
                            }
                        } catch (error) {
                            reject(new Error(`解析基金${fundId}数据失败: ${error.message}`));
                        }
                    } else {
                        reject(new Error(`获取基金${fundId}数据失败: HTTP ${xhr.status}`));
                    }
                }
            };

            xhr.onerror = function() {
                reject(new Error(`获取基金${fundId}数据失败: 网络错误`));
            };

            xhr.send();
        });
    }

    // 解析基金类型
    function parseFundType(fundName) {
        for (const [keyword, type] of Object.entries(fundTypeMap)) {
            if (fundName.includes(keyword)) {
                return type;
            }
        }
        return '混合型'; // 默认类型
    }

    // 生成默认基金数据
    async function generateDefaultFunds() {
        isLoading = true;
        fundData = [];

        try {
            // 显示加载状态
            const tableBody = document.getElementById('fundTableBody');
            tableBody.innerHTML = `
                    <tr>
                        <td colspan="10" class="px-6 py-4 text-center text-gray-500">
                            <i class="fa fa-spinner fa-spin mr-2"></i>正在加载基金数据...
                        </td>
                    </tr>
                `;

            // 循环获取所有默认基金数据
            for (const fundId of defaultFundIds) {
                try {
                    const data = await fetchFundData(fundId);

                    // 计算其他涨跌幅数据（这里使用随机值模拟）
                    const dailyChange = parseFloat(data.gszzl);
                    const weeklyChange = parseFloat((dailyChange + (Math.random() * 2 - 1)).toFixed(2));
                    const monthlyChange = parseFloat((dailyChange * 3 + (Math.random() * 5 - 2.5)).toFixed(2));
                    const yearlyChange = parseFloat((Math.random() * 30 + 5).toFixed(2));
                    const threeYearChange = parseFloat((Math.random() * 100 + 20).toFixed(2));

                    // 创建基金对象
                    const fund = {
                        id: data.fundcode,
                        name: data.name,
                        type: parseFundType(data.name),
                        nav: parseFloat(data.dwjz),
                        dailyChange: dailyChange,
                        weeklyChange: weeklyChange,
                        monthlyChange: monthlyChange,
                        yearlyChange: yearlyChange,
                        threeYearChange: threeYearChange,
                        updateTime: data.gztime,
                        date: data.jzrq
                    };

                    fundData.push(fund);
                } catch (error) {
                    console.error(`获取基金${fundId}数据失败:`, error);
                }
            }

            // 初始化过滤数据
            filteredData = [...fundData];
            currentPageData = [...fundData];

            // 更新页面显示
            updateTable();
            updateFilterOptions();
            updateStatistics();
            initTypeChart();

            isLoading = false;
        } catch (error) {
            console.error('加载基金数据失败:', error);
            isLoading = false;

            // 显示错误信息
            const tableBody = document.getElementById('fundTableBody');
            tableBody.innerHTML = `
                    <tr>
                        <td colspan="10" class="px-6 py-4 text-center text-red-500">
                            <i class="fa fa-exclamation-circle mr-2"></i>加载基金数据失败，请稍后重试
                        </td>
                    </tr>
                `;
        }
    }

    // 初始化基金类型分布图表
    function initTypeChart() {
        const ctx = document.getElementById('fundTypeChart').getContext('2d');

        // 计算各类型基金数量
        const typeCounts = {};
        fundData.forEach(fund => {
            typeCounts[fund.type] = (typeCounts[fund.type] || 0) + 1;
        });

        const labels = Object.keys(typeCounts);
        const data = Object.values(typeCounts);

        // 生成随机颜色
        const backgroundColors = labels.map(() => {
            const r = Math.floor(Math.random() * 200) + 55;
            const g = Math.floor(Math.random() * 200) + 55;
            const b = Math.floor(Math.random() * 200) + 55;
            return `rgba(${r}, ${g}, ${b}, 0.7)`;
        });

        typeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: backgroundColors,
                    borderColor: 'white',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            padding: 15
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = Math.round((value / total) * 100);
                                return `${label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                },
                cutout: '60%'
            }
        });
    }

    // 更新基金类型分布图表
    function updateTypeChart() {
        // 计算各类型基金数量
        const typeCounts = {};
        fundData.forEach(fund => {
            typeCounts[fund.type] = (typeCounts[fund.type] || 0) + 1;
        });

        const labels = Object.keys(typeCounts);
        const data = Object.values(typeCounts);

        // 生成随机颜色
        const backgroundColors = labels.map(() => {
            const r = Math.floor(Math.random() * 200) + 55;
            const g = Math.floor(Math.random() * 200) + 55;
            const b = Math.floor(Math.random() * 200) + 55;
            return `rgba(${r}, ${g}, ${b}, 0.7)`;
        });

        typeChart.data.labels = labels;
        typeChart.data.datasets[0].data = data;
        typeChart.data.datasets[0].backgroundColor = backgroundColors;
        typeChart.update();
    }

    // 设置事件监听器
    function setupEventListeners() {
        // 新增基金按钮点击事件
        document.getElementById('toggleAddFundBtn').addEventListener('click', function() {
            document.getElementById('addFundModal').classList.remove('hidden');
        });

        // 关闭模态框按钮点击事件
        document.getElementById('closeAddFundModal').addEventListener('click', function() {
            document.getElementById('addFundModal').classList.add('hidden');
        });

        // 取消按钮点击事件
        document.getElementById('cancelAddFund').addEventListener('click', function() {
            document.getElementById('addFundModal').classList.add('hidden');
        });

        // 查询基金按钮点击事件
        document.getElementById('searchFundBtn').addEventListener('click', function() {
            searchFund();
        });

        // 确认添加基金按钮点击事件
        document.getElementById('confirmAddFund').addEventListener('click', function() {
            addFundFromSearch();
        });

        // 基金ID输入框回车事件
        document.getElementById('searchFundId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchFund();
            }
        });

        // 搜索框输入事件
        document.getElementById('searchInput').addEventListener('input', function() {
            filterFunds();
        });

        // 刷新按钮点击事件
        document.getElementById('refreshBtn').addEventListener('click', function() {
            refreshData();
        });

        // 每页显示条数改变事件
        document.getElementById('rowsPerPage').addEventListener('change', function() {
            rowsPerPage = parseInt(this.value);
            currentPage = 1;
            updateTable();
        });

        // 基金名称筛选事件
        document.getElementById('filterFundName').addEventListener('change', function() {
            applyFilters();
        });

        // 基金类型筛选事件
        document.getElementById('filterFundType').addEventListener('change', function() {
            applyFilters();
        });

        // 重置筛选按钮点击事件
        document.getElementById('resetFilterBtn').addEventListener('click', function() {
            document.getElementById('filterFundName').value = '';
            document.getElementById('filterFundType').value = '';
            applyFilters();
        });



        // 上一页按钮点击事件
        document.getElementById('prevPage').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                updateTable();
            }
        });

        // 下一页按钮点击事件
        document.getElementById('nextPage').addEventListener('click', function() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                updateTable();
            }
        });

        // 表头排序点击事件
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', function() {
                const column = this.getAttribute('data-sort');
                sortTable(column);
            });
        });


    }

    // 全局变量：当前查询到的基金信息
    let currentSearchedFund = null;

    // 查询基金
    function searchFund() {
        const fundId = document.getElementById('searchFundId').value.trim();

        if (!fundId) {
            showSearchError('请输入基金ID');
            return;
        }

        // 显示加载状态
        document.getElementById('searchLoading').classList.remove('hidden');
        document.getElementById('searchResult').classList.add('hidden');
        document.getElementById('searchError').classList.add('hidden');

        // 模拟API请求延迟
        setTimeout(() => {
            // 模拟基金数据（实际应用中应该从API获取）
            const mockFundData = {
                id: fundId,
                name: `${fundId}基金名称`,
                type: fundTypes[Math.floor(Math.random() * fundTypes.length)],
                nav: (Math.random() * 3 + 0.5).toFixed(4),
                manager: '基金经理',
                establishDate: '2020-01-01',
                scale: `${(Math.random() * 10 + 1).toFixed(2)}亿`
            };

            // 隐藏加载状态
            document.getElementById('searchLoading').classList.add('hidden');

            // 显示查询结果
            const fundInfoDiv = document.getElementById('fundInfo');
            fundInfoDiv.innerHTML = `
                    <p><strong>基金ID:</strong> ${mockFundData.id}</p>
                    <p><strong>基金名称:</strong> ${mockFundData.name}</p>
                    <p><strong>基金类型:</strong> ${mockFundData.type}</p>
                    <p><strong>基金净值:</strong> ${mockFundData.nav}</p>
                    <p><strong>基金经理:</strong> ${mockFundData.manager}</p>
                    <p><strong>成立日期:</strong> ${mockFundData.establishDate}</p>
                    <p><strong>基金规模:</strong> ${mockFundData.scale}</p>
                `;

            // 保存当前查询到的基金信息
            currentSearchedFund = {
                id: mockFundData.id,
                name: mockFundData.name,
                type: mockFundData.type,
                nav: parseFloat(mockFundData.nav),
                dailyChange: (Math.random() * 4 - 2).toFixed(2),
                weeklyChange: (Math.random() * 8 - 3).toFixed(2),
                monthlyChange: (Math.random() * 15 - 5).toFixed(2),
                yearlyChange: (Math.random() * 40 - 10).toFixed(2),
                threeYearChange: (Math.random() * 100 + 20).toFixed(2)
            };

            document.getElementById('searchResult').classList.remove('hidden');
        }, 1000);
    }

    // 显示搜索错误
    function showSearchError(message) {
        document.getElementById('searchError').classList.remove('hidden');
        document.getElementById('errorMessage').textContent = message;
        document.getElementById('searchResult').classList.add('hidden');
        document.getElementById('searchLoading').classList.add('hidden');
    }

    // 从查询结果添加基金
    function addFundFromSearch() {
        if (!currentSearchedFund) return;

        // 检查基金ID是否已存在
        if (fundData.some(fund => fund.id === currentSearchedFund.id)) {
            showToast('基金ID已存在，请使用其他ID', 'error');
            return;
        }

        // 添加到数据中
        fundData.push(currentSearchedFund);
        filteredData = [...fundData];

        // 更新表格和统计数据
        updateTable();
        updateStatistics();
        updateTypeChart();
        updateFilterOptions();

        // 关闭模态框
        document.getElementById('addFundModal').classList.add('hidden');

        // 重置搜索状态
        document.getElementById('searchFundId').value = '';
        document.getElementById('searchResult').classList.add('hidden');
        currentSearchedFund = null;

        // 显示成功消息
        showToast(`成功添加基金: ${currentSearchedFund.name}`);
    }

    // 添加新基金（保留原有功能，用于兼容）
    function addFund() {
        // 此函数保留以兼容旧代码，实际功能已移至addFundFromSearch
        console.warn('addFund() 已被弃用，请使用 addFundFromSearch()');
    }

    // 过滤基金数据
    function filterFunds() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        if (searchTerm === '') {
            filteredData = [...fundData];
        } else {
            filteredData = fundData.filter(fund =>
                fund.id.toLowerCase().includes(searchTerm) ||
                fund.name.toLowerCase().includes(searchTerm)
            );
        }

        // 应用其他筛选条件
        applyFilters();
    }

    // 应用筛选条件
    function applyFilters() {
        const nameFilter = document.getElementById('filterFundName').value;
        const typeFilter = document.getElementById('filterFundType').value;

        let result = [...filteredData];

        // 应用基金名称筛选
        if (nameFilter) {
            result = result.filter(fund => fund.name === nameFilter);
        }

        // 应用基金类型筛选
        if (typeFilter) {
            result = result.filter(fund => fund.type === typeFilter);
        }

        // 更新当前页数据
        currentPageData = result;
        currentPage = 1;
        updateTable();
    }

    // 更新筛选选项
    function updateFilterOptions() {
        // 更新基金名称筛选选项
        const nameFilter = document.getElementById('filterFundName');
        const fundNames = [...new Set(fundData.map(fund => fund.name))];

        // 清空现有选项
        nameFilter.innerHTML = '<option value="">基金名称</option>';

        // 添加新选项
        fundNames.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            nameFilter.appendChild(option);
        });
    }

    // 排序表格（只对当前页数据排序）
    function sortTable(column) {
        // 如果点击的是当前排序列，则切换排序方向
        if (sortColumn === column) {
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            sortColumn = column;
            sortDirection = 'asc';
        }

        // 更新排序图标
        document.querySelectorAll('th[data-sort] i').forEach(icon => {
            icon.className = 'fa fa-sort ml-1 text-gray-400';
        });

        const currentSortIcon = document.querySelector(`th[data-sort="${column}"] i`);
        currentSortIcon.className = sortDirection === 'asc'
            ? 'fa fa-sort-asc ml-1 text-primary'
            : 'fa fa-sort-desc ml-1 text-primary';

        // 排序当前页数据
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = Math.min(startIndex + rowsPerPage, currentPageData.length);
        const pageData = currentPageData.slice(startIndex, endIndex);

        pageData.sort((a, b) => {
            let aVal = a[column];
            let bVal = b[column];

            // 处理数字类型
            if (typeof aVal === 'string' && !isNaN(parseFloat(aVal))) {
                aVal = parseFloat(aVal);
                bVal = parseFloat(bVal);
            }

            // 处理字符串类型
            if (typeof aVal === 'string') {
                aVal = aVal.toLowerCase();
                bVal = bVal.toLowerCase();
            }

            if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
            return 0;
        });

        // 更新当前页数据
        for (let i = 0; i < pageData.length; i++) {
            currentPageData[startIndex + i] = pageData[i];
        }

        updateTable();
    }

    // 更新表格
    function updateTable() {
        const tableBody = document.getElementById('fundTableBody');
        tableBody.innerHTML = '';

        // 计算分页
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = Math.min(startIndex + rowsPerPage, currentPageData.length);
        const pageData = currentPageData.slice(startIndex, endIndex);

        // 更新分页信息
        document.getElementById('startRange').textContent = currentPageData.length > 0 ? startIndex + 1 : 0;
        document.getElementById('endRange').textContent = endIndex;
        document.getElementById('totalItems').textContent = currentPageData.length;

        // 更新分页按钮状态
        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = endIndex >= currentPageData.length;

        // 生成表格行
        if (pageData.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.innerHTML = `
                    <td colspan="10" class="px-6 py-4 text-center text-gray-500">
                        <i class="fa fa-info-circle mr-2"></i>没有找到匹配的基金数据
                    </td>
                `;
            tableBody.appendChild(emptyRow);
        } else {
            pageData.forEach(fund => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';

                // 设置行数据
                row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${fund.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${fund.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-${getTypeColor(fund.type)}-100 text-${getTypeColor(fund.type)}-800">
                                ${fund.type}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 font-mono">${fund.nav.toFixed(4)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.dailyChange)} font-medium animate-value">
                            ${formatChange(fund.dailyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.weeklyChange)} font-medium animate-value">
                            ${formatChange(fund.weeklyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.monthlyChange)} font-medium animate-value">
                            ${formatChange(fund.monthlyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.yearlyChange)} font-medium animate-value">
                            ${formatChange(fund.yearlyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.threeYearChange)} font-medium animate-value">
                            ${formatChange(fund.threeYearChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <button class="text-primary hover:text-blue-700 mr-3" onclick="viewFundDetail('${fund.id}')">
                                <i class="fa fa-eye"></i>
                            </button>
                            <button class="text-danger hover:text-red-700" onclick="deleteFund('${fund.id}')">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;

                tableBody.appendChild(row);
            });
        }
    }

    // 更新统计数据
    function updateStatistics() {
        // 总基金数
        document.getElementById('totalFunds').textContent = fundData.length;
        document.getElementById('totalFundsChange').textContent = `+${Math.round(Math.random() * 5)}%`;

        // 计算平均涨幅
        const avgDailyChange = fundData.reduce((sum, fund) => sum + parseFloat(fund.dailyChange), 0) / fundData.length;
        const avgMonthlyChange = fundData.reduce((sum, fund) => sum + parseFloat(fund.monthlyChange), 0) / fundData.length;
        const avgThreeYearChange = fundData.reduce((sum, fund) => sum + parseFloat(fund.threeYearChange), 0) / fundData.length;

        // 更新平均涨幅显示
        document.getElementById('avgDailyChange').textContent = `${avgDailyChange.toFixed(2)}%`;
        document.getElementById('avgMonthlyChange').textContent = `${avgMonthlyChange.toFixed(2)}%`;
        document.getElementById('avgThreeYearChange').textContent = `${avgThreeYearChange.toFixed(2)}%`;

        // 更新趋势
        document.getElementById('avgDailyChangeTrend').innerHTML = getTrendText(avgDailyChange);
        document.getElementById('avgDailyChangeTrend').className = getTrendClass(avgDailyChange);

        document.getElementById('avgMonthlyChangeTrend').innerHTML = getTrendText(avgMonthlyChange);
        document.getElementById('avgMonthlyChangeTrend').className = getTrendClass(avgMonthlyChange);

        document.getElementById('avgThreeYearChangeTrend').innerHTML = getTrendText(avgThreeYearChange);
        document.getElementById('avgThreeYearChangeTrend').className = getTrendClass(avgThreeYearChange);
    }

    // 刷新数据（模拟实时更新）
    function refreshData() {
        // 添加刷新动画
        const refreshBtn = document.getElementById('refreshBtn');
        const icon = refreshBtn.querySelector('i');
        icon.className = 'fa fa-spinner fa-spin mr-2';
        refreshBtn.disabled = true;

        // 模拟API请求延迟
        setTimeout(() => {
            // 更新基金数据
            fundData.forEach(fund => {
                // 随机波动净值
                const navChange = (Math.random() * 0.02 - 0.01) * fund.nav;
                fund.nav = Math.max(0.01, parseFloat((fund.nav + navChange).toFixed(4)));

                // 随机波动涨幅
                fund.dailyChange = parseFloat((parseFloat(fund.dailyChange) + (Math.random() * 0.4 - 0.2)).toFixed(2));
                fund.weeklyChange = parseFloat((parseFloat(fund.weeklyChange) + (Math.random() * 0.6 - 0.3)).toFixed(2));
                fund.monthlyChange = parseFloat((parseFloat(fund.monthlyChange) + (Math.random() * 1 - 0.5)).toFixed(2));
                fund.yearlyChange = parseFloat((parseFloat(fund.yearlyChange) + (Math.random() * 2 - 1)).toFixed(2));
                fund.threeYearChange = parseFloat((parseFloat(fund.threeYearChange) + (Math.random() * 3 - 1.5)).toFixed(2));
            });

            // 更新过滤后的数据
            filterFunds();

            // 更新统计数据
            updateStatistics();

            // 恢复按钮状态
            icon.className = 'fa fa-refresh mr-2';
            refreshBtn.disabled = false;

            // 显示成功消息
            showToast('数据已成功刷新');
        }, 800);
    }

    // 查看基金详情
    function viewFundDetail(fundId) {
        // 先从当前页数据中查找
        let fund = currentPageData.find(f => f.id === fundId);
        // 如果没找到，从原始数据中查找
        if (!fund) {
            fund = fundData.find(f => f.id === fundId);
        }
        if (!fund) return;

        alert(`基金详情:\nID: ${fund.id}\n名称: ${fund.name}\n类型: ${fund.type}\n净值: ${fund.nav}\n当日涨幅: ${fund.dailyChange}%\n本周涨幅: ${fund.weeklyChange}%\n当月涨幅: ${fund.monthlyChange}%\n今年涨幅: ${fund.yearlyChange}%\n近三年涨幅: ${fund.threeYearChange}%`);
    }

    // 删除基金
    function deleteFund(fundId) {
        if (confirm('确定要删除此基金吗？')) {
            // 从原始数据中删除
            const index = fundData.findIndex(f => f.id === fundId);
            if (index !== -1) {
                const fundName = fundData[index].name;
                fundData.splice(index, 1);

                // 从当前页数据中删除
                const currentIndex = currentPageData.findIndex(f => f.id === fundId);
                if (currentIndex !== -1) {
                    currentPageData.splice(currentIndex, 1);
                }

                // 更新过滤选项
                updateFilterOptions();

                // 更新表格
                updateTable();

                // 更新统计数据和图表
                updateStatistics();
                updateTypeChart();

                // 显示成功消息
                showToast(`成功删除基金: ${fundName}`);
            }
        }
    }



    // 启动模拟实时数据更新
    function startRealTimeUpdates() {
        // 每30秒自动刷新一次数据
        setInterval(() => {
            // 随机决定是否更新数据（70%概率）
            if (Math.random() < 0.7) {
                refreshData();
            }
        }, 30000);
    }

    // 辅助函数：格式化涨跌幅
    function formatChange(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return `+${numValue}%`;
        } else {
            return `${numValue}%`;
        }
    }

    // 辅助函数：获取涨跌幅对应的CSS类
    function getChangeClass(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return 'text-success';
        } else if (numValue < 0) {
            return 'text-danger';
        } else {
            return 'text-gray-500';
        }
    }

    // 辅助函数：获取趋势文本
    function getTrendText(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return `<i class="fa fa-arrow-up mr-1"></i> ${Math.abs(numValue).toFixed(2)}%`;
        } else if (numValue < 0) {
            return `<i class="fa fa-arrow-down mr-1"></i> ${Math.abs(numValue).toFixed(2)}%`;
        } else {
            return `<i class="fa fa-minus mr-1"></i> 0%`;
        }
    }

    // 辅助函数：获取趋势CSS类
    function getTrendClass(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return 'text-success flex items-center text-sm';
        } else if (numValue < 0) {
            return 'text-danger flex items-center text-sm';
        } else {
            return 'text-gray-500 flex items-center text-sm';
        }
    }

    // 辅助函数：获取基金类型对应的颜色
    function getTypeColor(type) {
        const colorMap = {
            '股票型': 'red',
            '债券型': 'blue',
            '混合型': 'purple',
            '指数型': 'green',
            'ETF': 'yellow',
            'QDII': 'indigo',
            '货币型': 'teal',
            '理财型': 'pink'
        };

        return colorMap[type] || 'gray';
    }

    // 显示提示消息
    function showToast(message) {
        // 创建提示元素
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50 transform translate-y-10 opacity-0 transition-all duration-300';
        toast.textContent = message;

        // 添加到页面
        document.body.appendChild(toast);

        // 显示提示
        setTimeout(() => {
            toast.classList.remove('translate-y-10', 'opacity-0');
        }, 10);

        // 3秒后隐藏提示
        setTimeout(() => {
            toast.classList.add('translate-y-10', 'opacity-0');

            // 移除元素
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 300);
        }, 3000);
    }
</script>
