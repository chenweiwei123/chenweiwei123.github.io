<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金展示看板</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1a56db',
                        secondary: '#6b7280',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                        light: '#f3f4f6',
                        dark: '#111827',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass-effect {
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.18);
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .shadow-card {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            }
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(to right, #1a56db, #3b82f6);
            }
            .bg-gradient-blue {
                background-image: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            }
            .animate-value {
                transition: all 0.5s ease-out;
            }
            .animate-pulse-slow {
                animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }

    </style>
</head>
<body class="bg-gray-50 font-sans">
<div class="min-h-screen flex flex-col">

                    <div class="bg-blue-100 p-3 rounded-lg">
                        <i class="fa fa-folder-open text-primary text-xl"></i>
                    </div>
                </div>

                                    <div class="flex items-center">
                                        本周涨幅
                                        <i class="fa fa-sort ml-1 text-gray-400"></i>
                                    </div>
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" data-sort="monthlyChange">
                                    <div class="flex items-center">
                                        当月涨幅
                                        <i class="fa fa-sort ml-1 text-gray-400"></i>
                                    </div>
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" data-sort="yearlyChange">

                                        <i class="fa fa-sort ml-1 text-gray-400"></i>

                                        <i class="fa fa-sort ml-1 text-gray-400"></i>
                                    </div>

                                    操作
                                </th>
                            </tr>
                            </thead>

                            <!-- 基金数据将通过JavaScript动态填充 -->
                            <tr class="animate-pulse">
                                <td colspan="10" class="px-6 py-4 text-center text-gray-500">

                    </div>
                    <div id="pagination" class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">

    </main>

    <!-- 页脚 -->

                    <p class="text-sm">© 2025 基金展示看板. 保留所有权利.</p>

                        <i class="fa fa-linkedin text-xl"></i>

<!-- 新增基金模态框 -->
<div id="addFundModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
            <h3 class="text-xl font-semibold text-gray-800 flex items-center">
                <i class="fa fa-plus-circle text-primary mr-2"></i>
                新增基金记录

            <button id="closeAddFundModal" class="text-gray-400 hover:text-gray-600">

            <form id="addFundForm" class="space-y-4">

                    <label for="fundName" class="block text-sm font-medium text-gray-700 mb-1">基金名称</label>

                </div>
                <div>
                    <label for="fundType" class="block text-sm font-medium text-gray-700 mb-1">基金类型</label>
                    <select id="fundType" name="fundType" required="" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">请选择类型</option>
                        <option value="股票型">股票型</option>
                        <option value="债券型">债券型</option>
                        <option value="混合型">混合型</option>
                        <option value="指数型">指数型</option>
                        <option value="ETF">ETF</option>
                        <option value="QDII">QDII</option>

                <div>

                保存基金数据
            </button>

<!-- JavaScript -->
<script>
    // 全局变量
    let fundData = [];
    let filteredData = [];
    let currentPage = 1;
    let rowsPerPage = 10;
    let sortColumn = null;
    let sortDirection = 'asc';
    let typeChart = null;

    // 基金类型列表
    const fundTypes = ['股票型', '债券型', '混合型', '指数型', 'ETF', 'QDII', '货币型', '理财型'];

    // 初始化页面
    document.addEventListener('DOMContentLoaded', function() {
        // 生成默认基金数据
        generateDefaultFunds();

        // 初始化表格
        updateTable();

        // 初始化图表
        initTypeChart();

        // 更新统计数据
        updateStatistics();

        // 设置事件监听器
        setupEventListeners();

        // 启动模拟实时数据更新
        startRealTimeUpdates();
    });

    // 生成默认基金数据
    function generateDefaultFunds() {
        const defaultFunds = [
            { id: '000001', name: '华夏成长混合', type: '混合型', nav: 1.2345, dailyChange: 1.25, weeklyChange: 2.34, monthlyChange: 4.56, yearlyChange: 15.67, threeYearChange: 45.32 },
            { id: '000002', name: '华夏债券A', type: '债券型', nav: 1.0567, dailyChange: 0.12, weeklyChange: 0.34, monthlyChange: 1.23, yearlyChange: 3.45, threeYearChange: 10.23 },
            { id: '000003', name: '华夏股票A', type: '股票型', nav: 2.3456, dailyChange: -0.56, weeklyChange: 1.23, monthlyChange: 3.45, yearlyChange: 12.34, threeYearChange: 35.67 },
            { id: '000004', name: '华夏指数A', type: '指数型', nav: 1.8765, dailyChange: 0.78, weeklyChange: 1.56, monthlyChange: 5.67, yearlyChange: 18.76, threeYearChange: 52.34 },
            { id: '000005', name: '华夏ETF', type: 'ETF', nav: 3.4567, dailyChange: 1.45, weeklyChange: 2.67, monthlyChange: 6.78, yearlyChange: 22.34, threeYearChange: 67.89 },
            { id: '000006', name: '华夏QDII', type: 'QDII', nav: 1.5678, dailyChange: -0.23, weeklyChange: 0.78, monthlyChange: 2.34, yearlyChange: 8.76, threeYearChange: 24.56 },
            { id: '000007', name: '华夏货币A', type: '货币型', nav: 1.0001, dailyChange: 0.01, weeklyChange: 0.05, monthlyChange: 0.23, yearlyChange: 1.45, threeYearChange: 4.56 },
            { id: '000008', name: '华夏理财A', type: '理财型', nav: 1.1234, dailyChange: 0.08, weeklyChange: 0.45, monthlyChange: 1.78, yearlyChange: 5.67, threeYearChange: 15.43 },
            { id: '000009', name: '嘉实成长混合', type: '混合型', nav: 1.6789, dailyChange: 0.98, weeklyChange: 1.87, monthlyChange: 4.32, yearlyChange: 16.78, threeYearChange: 48.76 },
            { id: '000010', name: '嘉实债券A', type: '债券型', nav: 1.0876, dailyChange: 0.15, weeklyChange: 0.45, monthlyChange: 1.56, yearlyChange: 4.32, threeYearChange: 12.67 }
        ];

        fundData = defaultFunds;
        filteredData = [...fundData];
    }

    // 初始化基金类型分布图表
    function initTypeChart() {
        const ctx = document.getElementById('fundTypeChart').getContext('2d');

        // 计算各类型基金数量
        const typeCounts = {};
        fundData.forEach(fund => {
            typeCounts[fund.type] = (typeCounts[fund.type] || 0) + 1;
        });

        const labels = Object.keys(typeCounts);
        const data = Object.values(typeCounts);

        // 生成随机颜色
        const backgroundColors = labels.map(() => {
            const r = Math.floor(Math.random() * 200) + 55;
            const g = Math.floor(Math.random() * 200) + 55;
            const b = Math.floor(Math.random() * 200) + 55;
            return `rgba(${r}, ${g}, ${b}, 0.7)`;
        });

        typeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: backgroundColors,
                    borderColor: 'white',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            padding: 15
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = Math.round((value / total) * 100);
                                return `${label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                },
                cutout: '60%'
            }
        });
    }

    // 更新基金类型分布图表
    function updateTypeChart() {
        // 计算各类型基金数量
        const typeCounts = {};
        fundData.forEach(fund => {
            typeCounts[fund.type] = (typeCounts[fund.type] || 0) + 1;
        });

        const labels = Object.keys(typeCounts);
        const data = Object.values(typeCounts);

        // 生成随机颜色
        const backgroundColors = labels.map(() => {
            const r = Math.floor(Math.random() * 200) + 55;
            const g = Math.floor(Math.random() * 200) + 55;
            const b = Math.floor(Math.random() * 200) + 55;
            return `rgba(${r}, ${g}, ${b}, 0.7)`;
        });

        typeChart.data.labels = labels;
        typeChart.data.datasets[0].data = data;
        typeChart.data.datasets[0].backgroundColor = backgroundColors;
        typeChart.update();
    }

    // 设置事件监听器
    function setupEventListeners() {
        // 新增基金按钮点击事件
        document.getElementById('toggleAddFundBtn').addEventListener('click', function() {
            document.getElementById('addFundModal').classList.remove('hidden');
        });

        // 关闭模态框按钮点击事件
        document.getElementById('closeAddFundModal').addEventListener('click', function() {
            document.getElementById('addFundModal').classList.add('hidden');
        });

        // 取消按钮点击事件
        document.getElementById('cancelAddFund').addEventListener('click', function() {
            document.getElementById('addFundModal').classList.add('hidden');
        });

        // 保存按钮点击事件
        document.getElementById('submitAddFund').addEventListener('click', function() {
            addFund();
        });

        // 表单提交事件（用于支持回车键提交）
        document.getElementById('addFundForm').addEventListener('submit', function(e) {
            e.preventDefault();
            addFund();
        });

        // 搜索框输入事件
        document.getElementById('searchInput').addEventListener('input', function() {
            filterFunds();
        });

        // 刷新按钮点击事件
        document.getElementById('refreshBtn').addEventListener('click', function() {
            refreshData();
        });

        // 每页显示条数改变事件
        document.getElementById('rowsPerPage').addEventListener('change', function() {
            rowsPerPage = parseInt(this.value);
            currentPage = 1;
            updateTable();
        });



        // 上一页按钮点击事件
        document.getElementById('prevPage').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                updateTable();
            }
        });

        // 下一页按钮点击事件
        document.getElementById('nextPage').addEventListener('click', function() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                updateTable();
            }
        });

        // 表头排序点击事件
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', function() {
                const column = this.getAttribute('data-sort');
                sortTable(column);
            });
        });


    }

    // 添加新基金
    function addFund() {
        const formData = new FormData(document.getElementById('addFundForm'));

        // 检查基金ID是否已存在
        const fundId = formData.get('fundId');
        if (fundData.some(fund => fund.id === fundId)) {
            alert('基金ID已存在，请使用其他ID');
            return;
        }

        // 创建新基金对象
        const newFund = {
            id: fundId,
            name: formData.get('fundName'),
            type: formData.get('fundType'),
            nav: parseFloat(formData.get('fundNav')),
            dailyChange: (Math.random() * 4 - 2).toFixed(2),
            weeklyChange: (Math.random() * 8 - 3).toFixed(2),
            monthlyChange: (Math.random() * 15 - 5).toFixed(2),
            yearlyChange: (Math.random() * 40 - 10).toFixed(2),
            threeYearChange: (Math.random() * 100 + 20).toFixed(2)
        };

        // 添加到数据中
        fundData.push(newFund);
        filteredData = [...fundData];

        // 更新表格和统计数据
        updateTable();
        updateStatistics();
        updateTypeChart();

        // 重置表单
        document.getElementById('addFundForm').reset();

        // 关闭模态框
        document.getElementById('addFundModal').classList.add('hidden');

        // 显示成功消息
        showToast(`成功添加基金: ${newFund.name}`);
    }

    // 过滤基金数据
    function filterFunds() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        if (searchTerm === '') {
            filteredData = [...fundData];
        } else {
            filteredData = fundData.filter(fund =>
                fund.id.toLowerCase().includes(searchTerm) ||
                fund.name.toLowerCase().includes(searchTerm)
            );
        }

        currentPage = 1;
        updateTable();
    }

    // 排序表格
    function sortTable(column) {
        // 如果点击的是当前排序列，则切换排序方向
        if (sortColumn === column) {
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            sortColumn = column;
            sortDirection = 'asc';
        }

        // 更新排序图标
        document.querySelectorAll('th[data-sort] i').forEach(icon => {
            icon.className = 'fa fa-sort ml-1 text-gray-400';
        });

        const currentSortIcon = document.querySelector(`th[data-sort="${column}"] i`);
        currentSortIcon.className = sortDirection === 'asc'
            ? 'fa fa-sort-asc ml-1 text-primary'
            : 'fa fa-sort-desc ml-1 text-primary';

        // 排序数据
        filteredData.sort((a, b) => {
            let aVal = a[column];
            let bVal = b[column];

            // 处理数字类型
            if (typeof aVal === 'string' && !isNaN(parseFloat(aVal))) {
                aVal = parseFloat(aVal);
                bVal = parseFloat(bVal);
            }

            // 处理字符串类型
            if (typeof aVal === 'string') {
                aVal = aVal.toLowerCase();
                bVal = bVal.toLowerCase();
            }

            if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
            return 0;
        });

        updateTable();
    }

    // 更新表格
    function updateTable() {
        const tableBody = document.getElementById('fundTableBody');
        tableBody.innerHTML = '';

        // 计算分页
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
        const pageData = filteredData.slice(startIndex, endIndex);

        // 更新分页信息
        document.getElementById('startRange').textContent = filteredData.length > 0 ? startIndex + 1 : 0;
        document.getElementById('endRange').textContent = endIndex;
        document.getElementById('totalItems').textContent = filteredData.length;

        // 更新分页按钮状态
        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = endIndex >= filteredData.length;

        // 生成表格行
        if (pageData.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.innerHTML = `
                    <td colspan="10" class="px-6 py-4 text-center text-gray-500">
                        <i class="fa fa-info-circle mr-2"></i>没有找到匹配的基金数据
                    </td>
                `;
            tableBody.appendChild(emptyRow);
        } else {
            pageData.forEach(fund => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';

                // 设置行数据
                row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${fund.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${fund.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-${getTypeColor(fund.type)}-100 text-${getTypeColor(fund.type)}-800">
                                ${fund.type}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 font-mono">${fund.nav.toFixed(4)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.dailyChange)} font-medium animate-value">
                            ${formatChange(fund.dailyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.weeklyChange)} font-medium animate-value">
                            ${formatChange(fund.weeklyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.monthlyChange)} font-medium animate-value">
                            ${formatChange(fund.monthlyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.yearlyChange)} font-medium animate-value">
                            ${formatChange(fund.yearlyChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${getChangeClass(fund.threeYearChange)} font-medium animate-value">
                            ${formatChange(fund.threeYearChange)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <button class="text-primary hover:text-blue-700 mr-3" onclick="viewFundDetail('${fund.id}')">
                                <i class="fa fa-eye"></i>
                            </button>
                            <button class="text-danger hover:text-red-700" onclick="deleteFund('${fund.id}')">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;

                tableBody.appendChild(row);
            });
        }
    }

    // 更新统计数据
    function updateStatistics() {
        // 总基金数
        document.getElementById('totalFunds').textContent = fundData.length;
        document.getElementById('totalFundsChange').textContent = `+${Math.round(Math.random() * 5)}%`;

        // 计算平均涨幅
        const avgDailyChange = fundData.reduce((sum, fund) => sum + parseFloat(fund.dailyChange), 0) / fundData.length;
        const avgMonthlyChange = fundData.reduce((sum, fund) => sum + parseFloat(fund.monthlyChange), 0) / fundData.length;
        const avgThreeYearChange = fundData.reduce((sum, fund) => sum + parseFloat(fund.threeYearChange), 0) / fundData.length;

        // 更新平均涨幅显示
        document.getElementById('avgDailyChange').textContent = `${avgDailyChange.toFixed(2)}%`;
        document.getElementById('avgMonthlyChange').textContent = `${avgMonthlyChange.toFixed(2)}%`;
        document.getElementById('avgThreeYearChange').textContent = `${avgThreeYearChange.toFixed(2)}%`;

        // 更新趋势
        document.getElementById('avgDailyChangeTrend').textContent = getTrendText(avgDailyChange);
        document.getElementById('avgDailyChangeTrend').className = getTrendClass(avgDailyChange);

        document.getElementById('avgMonthlyChangeTrend').textContent = getTrendText(avgMonthlyChange);
        document.getElementById('avgMonthlyChangeTrend').className = getTrendClass(avgMonthlyChange);

        document.getElementById('avgThreeYearChangeTrend').textContent = getTrendText(avgThreeYearChange);
        document.getElementById('avgThreeYearChangeTrend').className = getTrendClass(avgThreeYearChange);
    }

    // 刷新数据（模拟实时更新）
    function refreshData() {
        // 添加刷新动画
        const refreshBtn = document.getElementById('refreshBtn');
        const icon = refreshBtn.querySelector('i');
        icon.className = 'fa fa-spinner fa-spin mr-2';
        refreshBtn.disabled = true;

        // 模拟API请求延迟
        setTimeout(() => {
            // 更新基金数据
            fundData.forEach(fund => {
                // 随机波动净值
                const navChange = (Math.random() * 0.02 - 0.01) * fund.nav;
                fund.nav = Math.max(0.01, parseFloat((fund.nav + navChange).toFixed(4)));

                // 随机波动涨幅
                fund.dailyChange = parseFloat((parseFloat(fund.dailyChange) + (Math.random() * 0.4 - 0.2)).toFixed(2));
                fund.weeklyChange = parseFloat((parseFloat(fund.weeklyChange) + (Math.random() * 0.6 - 0.3)).toFixed(2));
                fund.monthlyChange = parseFloat((parseFloat(fund.monthlyChange) + (Math.random() * 1 - 0.5)).toFixed(2));
                fund.yearlyChange = parseFloat((parseFloat(fund.yearlyChange) + (Math.random() * 2 - 1)).toFixed(2));
                fund.threeYearChange = parseFloat((parseFloat(fund.threeYearChange) + (Math.random() * 3 - 1.5)).toFixed(2));
            });

            // 更新过滤后的数据
            filterFunds();

            // 更新统计数据
            updateStatistics();

            // 恢复按钮状态
            icon.className = 'fa fa-refresh mr-2';
            refreshBtn.disabled = false;

            // 显示成功消息
            showToast('数据已成功刷新');
        }, 800);
    }

    // 查看基金详情
    function viewFundDetail(fundId) {
        const fund = fundData.find(f => f.id === fundId);
        if (!fund) return;

        alert(`基金详情:\nID: ${fund.id}\n名称: ${fund.name}\n类型: ${fund.type}\n净值: ${fund.nav}\n当日涨幅: ${fund.dailyChange}%\n本周涨幅: ${fund.weeklyChange}%\n当月涨幅: ${fund.monthlyChange}%\n今年涨幅: ${fund.yearlyChange}%\n近三年涨幅: ${fund.threeYearChange}%`);
    }

    // 删除基金
    function deleteFund(fundId) {
        if (confirm('确定要删除此基金吗？')) {
            const index = fundData.findIndex(f => f.id === fundId);
            if (index !== -1) {
                const fundName = fundData[index].name;
                fundData.splice(index, 1);

                // 更新过滤后的数据
                filterFunds();

                // 更新统计数据和图表
                updateStatistics();
                updateTypeChart();

                // 显示成功消息
                showToast(`成功删除基金: ${fundName}`);
            }
        }
    }



    // 启动模拟实时数据更新
    function startRealTimeUpdates() {
        // 每30秒自动刷新一次数据
        setInterval(() => {
            // 随机决定是否更新数据（70%概率）
            if (Math.random() < 0.7) {
                refreshData();
            }
        }, 30000);
    }

    // 辅助函数：格式化涨跌幅
    function formatChange(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return `+${numValue}%`;
        } else {
            return `${numValue}%`;
        }
    }

    // 辅助函数：获取涨跌幅对应的CSS类
    function getChangeClass(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return 'text-success';
        } else if (numValue < 0) {
            return 'text-danger';
        } else {
            return 'text-gray-500';
        }
    }

    // 辅助函数：获取趋势文本
    function getTrendText(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return `<i class="fa fa-arrow-up mr-1"></i> ${Math.abs(numValue).toFixed(2)}%`;
        } else if (numValue < 0) {
            return `<i class="fa fa-arrow-down mr-1"></i> ${Math.abs(numValue).toFixed(2)}%`;
        } else {
            return `<i class="fa fa-minus mr-1"></i> 0%`;
        }
    }

    // 辅助函数：获取趋势CSS类
    function getTrendClass(value) {
        const numValue = parseFloat(value);
        if (numValue > 0) {
            return 'text-success flex items-center text-sm';
        } else if (numValue < 0) {
            return 'text-danger flex items-center text-sm';
        } else {
            return 'text-gray-500 flex items-center text-sm';
        }
    }

    // 辅助函数：获取基金类型对应的颜色
    function getTypeColor(type) {
        const colorMap = {
            '股票型': 'red',
            '债券型': 'blue',
            '混合型': 'purple',
            '指数型': 'green',
            'ETF': 'yellow',
            'QDII': 'indigo',
            '货币型': 'teal',
            '理财型': 'pink'
        };

        return colorMap[type] || 'gray';
    }

    // 显示提示消息
    function showToast(message) {
        // 创建提示元素
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50 transform translate-y-10 opacity-0 transition-all duration-300';
        toast.textContent = message;

        // 添加到页面
        document.body.appendChild(toast);

        // 显示提示
        setTimeout(() => {
            toast.classList.remove('translate-y-10', 'opacity-0');
        }, 10);

        // 3秒后隐藏提示
        setTimeout(() => {
            toast.classList.add('translate-y-10', 'opacity-0');

            // 移除元素
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 300);
        }, 3000);
    }
</script>

</body></html>
